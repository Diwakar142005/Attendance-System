<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Records</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #F0F2F5;
      --surface:   #FFFFFF;
      --border:    #E2E5EA;
      --border-lt: #F0F2F5;
      --text-h:    #0F1117;
      --text-b:    #374151;
      --text-m:    #6B7280;
      --text-lt:   #9CA3AF;
      --accent:    #2563EB;
      --green-bg:  #ECFDF5;
      --green-fg:  #065F46;
      --red-bg:    #FEF2F2;
      --red-fg:    #991B1B;
      --del-bg:    #FEF2F2;
      --del-fg:    #991B1B;
      --del-border:#FECACA;
      --del-hover: #FEE2E2;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-b);
      min-height: 100vh;
      padding: 2.5rem 1.25rem;
    }

    .container { max-width: 780px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .topbar-left { display: flex; flex-direction: column; gap: 0.5rem; }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      color: var(--text-h);
      letter-spacing: -0.02em;
    }

    .subtitle { font-size: 0.8125rem; color: var(--text-m); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      flex-wrap: wrap;
    }

    /* ── Export button ── */
  .export-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #16a34a;
  color: white;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.export-btn:hover {
  background: #15803d;
  transform: translateY(-2px);
}
    /* ── Search ── */
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-icon { position: absolute; left: 10px; color: var(--text-lt); pointer-events: none; }
    .search-bar {
      font-family: inherit;
      font-size: 0.8125rem;
      color: var(--text-b);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px 8px 34px;
      width: 210px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-bar::placeholder { color: var(--text-lt); }
    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    /* ── Table ── */
    .tbl-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    thead { background: #F8FAFC; }
    th {
      padding: 10px 16px;
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-m);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-lt);
      vertical-align: middle;
      color: var(--text-b);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #F8FAFC; }

    .mono {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-m);
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-present { background: var(--green-bg); color: var(--green-fg); }
    .badge-present::before { background: var(--green-fg); }
    .badge-absent  { background: var(--red-bg);   color: var(--red-fg); }
    .badge-absent::before  { background: var(--red-fg); }

    /* ── Delete button ── */
    .del-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--del-fg);
      background: var(--del-bg);
      border: 1px solid var(--del-border);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .del-btn:hover { background: var(--del-hover); border-color: #FCA5A5; }

    /* ── Empty state ── */
    .empty-row td {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-m);
      font-size: 0.875rem;
    }

    /* ── Footer ── */
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-b);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 14px;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: background 0.15s;
    }
    .back-link:hover { background: #F8FAFC; }

    #record-count { font-size: 0.75rem; color: var(--text-lt); }
  </style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div class="topbar-left">
      <h1>Attendance Records</h1>
      <p class="subtitle">All student attendance entries</p>
    </div>

    <div class="topbar-right">

      <!-- Export to Excel button -->
      <a class="export-btn" href="/export_excel">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="14" height="14" rx="2" fill="#1D6F42" stroke="#1D6F42"/>
          <path d="M4 5l2.5 3L4 11h1.5l1.75-2.2L9 11h1.5L8 8l2.5-3H9L7.25 7.2 5.5 5H4z" fill="white"/>
        </svg>
        Export to Excel
      </a>

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input
          class="search-bar"
          type="search"
          placeholder="Search name or roll…"
          oninput="filterTable(this.value)"
          aria-label="Search attendance records"
        />
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Roll No.</th>
          <th>Name</th>
          <th>Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="att-body">
        {% for a in data %}
        <tr data-row="{{ a[0] }}|{{ a[1] }}|{{ a[2] }}|{{ a[3] }}">
          <td class="mono">{{ a[0] }}</td>
          <td>{{ a[1] }}</td>
          <td class="mono">{{ a[2] }}</td>
          <td>
            <span class="badge {% if a[3] == 'Present' %}badge-present{% else %}badge-absent{% endif %}">
              {{ a[3] }}
            </span>
          </td>
          <td>
            <a class="del-btn" href="/delete_attendance/{{ a[0] }}/{{ a[2] }}" onclick="return confirm('Delete this record?')">
              🗑 Delete
            </a>
          </td>
        </tr>
        {% endfor %}

        <tr class="empty-row" id="empty-row" style="display:none;">
          <td colspan="5">No records found.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer-row">
    <a class="back-link" href="/dashboard">
      &#8592; Back to Dashboard
    </a>
    <span id="record-count"></span>
  </div>

</div>
<script>
  function updateCount() {
    var rows = document.querySelectorAll('#att-body tr:not(.empty-row)');
    var visible = 0;
    rows.forEach(function(r) { if (r.style.display !== 'none') visible++; });
    var countEl = document.getElementById('record-count');
    countEl.textContent = visible + ' record' + (visible !== 1 ? 's' : '');
    document.getElementById('empty-row').style.display = (visible === 0) ? '' : 'none';
  }

  function filterTable(q) {
    q = q.toLowerCase().trim();
    document.querySelectorAll('#att-body tr:not(.empty-row)').forEach(function(row) {
      var match = !q || row.dataset.row.toLowerCase().includes(q);
      row.style.display = match ? '' : 'none';
    });
    updateCount();
  }

  updateCount();
</script>
</body>
</html>
