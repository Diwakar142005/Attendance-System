<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div style="width:100%;max-width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem;">

  <div style="text-align:center;margin-bottom:1.5rem;">
    <div style="width:48px;height:48px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
      <i class="ti ti-school" style="font-size:22px;color:#534AB7;"></i>
    </div>
    <h2 style="margin:0 0 4px;font-size:1.25rem;font-weight:500;">Student login</h2>
    <p style="margin:0;font-size:0.875rem;color:#6b7280;">Enter your roll number and password</p>
  </div>

  <form method="post">
    <div style="margin-bottom:1rem;">
      <label style="display:block;font-size:0.8125rem;font-weight:500;margin-bottom:5px;">Roll number</label>
      <input type="text" name="roll" placeholder="e.g. 21CS045" required
        style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:0.875rem;">
    </div>

    <div style="margin-bottom:1.25rem;">
      <label style="display:block;font-size:0.8125rem;font-weight:500;margin-bottom:5px;">Password</label>
      <div style="position:relative;">
        <input type="password" id="student_password" name="password" placeholder="Enter password" required
          style="width:100%;padding:8px 40px 8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:0.875rem;">
        <button type="button" onclick="togglePassword()"
          style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#9ca3af;display:flex;align-items:center;">
          <i class="ti ti-eye" id="eyeIcon" style="font-size:18px;"></i>
        </button>
      </div>
    </div>

    <button type="submit"
      style="width:100%;padding:10px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:0.875rem;font-weight:500;cursor:pointer;">
      Login
    </button>
  </form>

  <p style="text-align:center;font-size:0.8125rem;color:#6b7280;margin-top:1rem;">
    Staff? <a href="/login" style="color:#534AB7;font-weight:500;text-decoration:none;">Sign in here</a>
  </p>

</div>

<script>
function togglePassword() {
    var x = document.getElementById("student_password");
    var icon = document.getElementById("eyeIcon");
    if (x.type === "password") {
        x.type = "text";
        icon.className = "ti ti-eye-off";
    } else {
        x.type = "password";
        icon.className = "ti ti-eye";
    }
}
</script>

</body>
</html>
