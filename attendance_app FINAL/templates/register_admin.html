<!DOCTYPE html>
<html>
<head>
    <title>Create Admin Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            position: relative;
        }

        .field i {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #888;
            pointer-events: none;
        }

        .field i.toggle-eye {
            left: auto;
            right: 11px;
            cursor: pointer;
            pointer-events: all;
        }

        .field input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: #534AB7;
        }

        .field input.has-toggle {
            padding-right: 36px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            margin-top: 4px;
            background: #534AB7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #4339a0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #534AB7;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Admin Account</h2>

    <form method="post" class="fields">

        <div class="field">
            <i class="ti ti-user"></i>
            <input type="text" name="name" placeholder="Full Name" required>
        </div>

        <div class="field">
            <i class="ti ti-mail"></i>
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="field">
            <i class="ti ti-phone"></i>
            <input type="text" name="phone" placeholder="Phone Number" required>
        </div>

        <div class="field">
            <i class="ti ti-lock"></i>
            <input type="password" name="password" id="password" placeholder="Password" class="has-toggle" required>
            <i class="ti ti-eye toggle-eye" id="eyeIcon" onclick="togglePassword()"></i>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <a href="/" class="back-link">← Back to Login</a>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'ti ti-eye-off toggle-eye';
        } else {
            input.type = 'password';
            icon.className = 'ti ti-eye toggle-eye';
        }
    }
</script>

</body>
</html>
