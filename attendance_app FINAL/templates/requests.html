<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Requests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F4F6FB;min-height:100vh;padding:2rem 1.25rem;color:#0F172A}
    .wrap{max-width:760px;margin:auto}

    /* Topbar */
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .topbar-title{font-size:1.125rem;font-weight:600;color:#0F172A;display:flex;align-items:center;gap:8px}
    .topbar-title i{font-size:20px;color:#4F46E5}
    .topbar-sub{font-size:0.8125rem;color:#64748B;margin-top:3px}
    .count-pill{font-size:0.75rem;font-weight:500;background:#EEF2FF;color:#4F46E5;border:1px solid #C7D2FE;border-radius:99px;padding:2px 10px}

    /* Table card */
    .tbl-wrap{background:#fff;border:1px solid #E2E6EF;border-radius:12px;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:0.8125rem}
    thead{background:#F8FAFC}
    th{padding:10px 16px;text-align:left;font-size:0.6875rem;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #E2E6EF}
    td{padding:12px 16px;border-bottom:1px solid #F1F5F9;vertical-align:middle;color:#0F172A}
    tbody tr:last-child td{border-bottom:none}
    tbody tr{transition:background .1s}
    tbody tr:hover{background:#F8FAFF}
    .mono{font-family:'DM Mono',monospace;font-size:0.75rem;color:#64748B}

    /* Action buttons */
    .btn-accept{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:#ECFDF5;color:#065F46;border:1px solid #6EE7B7;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:500;cursor:pointer;text-decoration:none;transition:background .15s}
    .btn-accept:hover{background:#D1FAE5}
    .btn-reject{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:500;cursor:pointer;text-decoration:none;transition:background .15s}
    .btn-reject:hover{background:#FEE2E2}
    .action-cell{display:flex;align-items:center;gap:6px}

    /* Empty state */
    .empty-state{text-align:center;padding:3rem 1rem;color:#94A3B8}
    .empty-state i{font-size:32px;margin-bottom:10px;display:block;opacity:.4}
    .empty-state p{font-size:0.875rem}

    /* Back link */
    .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;font-size:0.8125rem;font-weight:500;color:#374151;text-decoration:none;border:1px solid #E2E6EF;border-radius:8px;padding:7px 14px;background:#fff;transition:background .15s}
    .back-link:hover{background:#F8FAFF;border-color:#C7D2FE;color:#4F46E5}
  </style>
</head>
<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="topbar-title">
        <i class="ti ti-mail-forward"></i>
        Attendance Requests
        <span class="count-pill">{{ data|length }} pending</span>
      </div>
      <div class="topbar-sub">Review and approve student attendance requests</div>
    </div>
  </div>

  <!-- Table -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Roll</th>
          <th>Name</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for r in data %}
        <tr>
          <td class="mono">{{ r[1] }}</td>
          <td>{{ r[2] }}</td>
          <td class="mono">{{ r[3] }}</td>
          <td>
            <div class="action-cell">
              <a href="/approve/{{ r[0] }}" class="btn-accept">
                <i class="ti ti-circle-check" style="font-size:13px"></i> Approve
              </a>
              <a href="/reject/{{ r[0] }}" class="btn-reject">
                <i class="ti ti-circle-x" style="font-size:13px"></i> Reject
              </a>
            </div>
          </td>
        </tr>
        {% endfor %}

        {% if data|length == 0 %}
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="ti ti-inbox"></i>
              <p>No pending requests.</p>
            </div>
          </td>
        </tr>
        {% endif %}
      </tbody>
    </table>
  </div>

  <a class="back-link" href="/dashboard">
    <i class="ti ti-arrow-left"></i> Back to dashboard
  </a>

</div>
</body>
</html>
